<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#0f172a; border-radius:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="soulGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="viewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="890" height="430" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <g transform="translate(40, 38)">
    <rect width="180" height="28" rx="14" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="18" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">GOOGLE AI EDGE GALLERY</text>
    <text x="200" y="20" fill="#f8fafc" font-size="20" font-weight="700">Leo: On-Device Architecture</text>
    <text x="530" y="20" fill="#94a3b8" font-size="13">100% Locale • Zero Dipendenze • Privacy By Design</text>
  </g>

  <!-- Device Context Box -->
  <rect x="40" y="85" width="840" height="335" rx="12" fill="#131e33" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="112" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">ANDROID RUNTIME / ON-DEVICE ENVIRONMENT</text>

  <!-- Box 1: The Soul -->
  <g transform="translate(60, 130)">
    <rect width="240" height="265" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="44" rx="12" fill="#0284c7" fill-opacity="0.2"/>
    <circle cx="26" cy="22" r="10" fill="#0284c7"/>
    <text x="26" y="26" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    <text x="46" y="26" fill="#38bdf8" font-size="14" font-weight="700">THE SOUL</text>
    <text x="175" y="26" fill="#94a3b8" font-size="11">SKILL.md</text>

    <!-- Details -->
    <text x="18" y="70" fill="#e2e8f0" font-size="13" font-weight="600">Prompt di Sistema LLM</text>
    <text x="18" y="92" fill="#94a3b8" font-size="12">• Persona empatica e stoica</text>
    <text x="18" y="112" fill="#94a3b8" font-size="12">• Traduzione concetti in metafore</text>
    <text x="18" y="132" fill="#94a3b8" font-size="12">• Risposte calibrate sul livello</text>

    <!-- Regola Zero Callout -->
    <rect x="14" y="155" width="212" height="85" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1"/>
    <text x="24" y="176" fill="#f87171" font-size="11" font-weight="700">🛡️ REGOLA ZERO</text>
    <text x="24" y="196" fill="#cbd5e1" font-size="11">Divieto assoluto di consigli</text>
    <text x="24" y="211" fill="#cbd5e1" font-size="11">speculativi o selezioni stock.</text>
    <text x="24" y="226" fill="#94a3b8" font-size="10">Educazione pura &amp; no-FOMO.</text>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <g transform="translate(305, 230)">
    <path d="M 0 0 L 45 0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="45,-4 53,0 45,4" fill="#38bdf8"/>
    <text x="25" y="-8" fill="#94a3b8" font-size="10" text-anchor="middle">JSON IPC</text>
  </g>

  <!-- Box 2: The Brain -->
  <g transform="translate(365, 130)">
    <rect width="240" height="265" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="44" rx="12" fill="#d97706" fill-opacity="0.2"/>
    <circle cx="26" cy="22" r="10" fill="#d97706"/>
    <text x="26" y="26" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">2</text>
    <text x="46" y="26" fill="#fbbf24" font-size="14" font-weight="700">THE BRAIN</text>
    <text x="175" y="26" fill="#94a3b8" font-size="11">brain.js</text>

    <!-- Details -->
    <text x="18" y="70" fill="#e2e8f0" font-size="13" font-weight="600">Runtime Logico &amp; Stato</text>
    <text x="18" y="92" fill="#94a3b8" font-size="12">• Memoria persistente locale</text>
    <text x="18" y="112" fill="#94a3b8" font-size="12">• Engine sblocco 10 badge</text>
    <text x="18" y="132" fill="#94a3b8" font-size="12">• Gestore percorso 13 moduli</text>
    <text x="18" y="152" fill="#94a3b8" font-size="12">• Generatore pillole economiche</text>

    <!-- LocalStorage Card -->
    <rect x="14" y="172" width="212" height="68" rx="8" fill="#fbbf24" fill-opacity="0.1" stroke="#d97706" stroke-width="1"/>
    <text x="24" y="193" fill="#fde68a" font-size="11" font-weight="700">💾 ON-DEVICE STORAGE</text>
    <text x="24" y="211" fill="#cbd5e1" font-size="11">Zero server, zero cloud sync.</text>
    <text x="24" y="226" fill="#94a3b8" font-size="10">Dati cifrati sul dispositivo utente.</text>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <g transform="translate(610, 230)">
    <path d="M 0 0 L 45 0" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="45,-4 53,0 45,4" fill="#34d399"/>
    <text x="25" y="-8" fill="#94a3b8" font-size="10" text-anchor="middle">ViewHub</text>
  </g>

  <!-- Box 3: The View / Dashboard -->
  <g transform="translate(665, 130)">
    <rect width="195" height="265" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="195" height="44" rx="12" fill="#059669" fill-opacity="0.2"/>
    <circle cx="26" cy="22" r="10" fill="#059669"/>
    <text x="26" y="26" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    <text x="46" y="26" fill="#34d399" font-size="14" font-weight="700">THE UI</text>
    <text x="125" y="26" fill="#94a3b8" font-size="11">webview.html</text>

    <!-- Details -->
    <text x="16" y="70" fill="#e2e8f0" font-size="13" font-weight="600">Dashboard Webview</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• Vanilla JS ultra-veloce</text>
    <text x="16" y="112" fill="#94a3b8" font-size="12">• CSS Variables (Dark/Light)</text>
    <text x="16" y="132" fill="#94a3b8" font-size="12">• Scheda Badge &amp; Livello</text>
    <text x="16" y="152" fill="#94a3b8" font-size="12">• i18n Nativo (IT / EN)</text>

    <!-- Benchmark Badge -->
    <rect x="14" y="172" width="167" height="68" rx="8" fill="#34d399" fill-opacity="0.1" stroke="#059669" stroke-width="1"/>
    <text x="22" y="193" fill="#6ee7b7" font-size="11" font-weight="700">⚡ IMPATTO MINIMO</text>
    <text x="22" y="211" fill="#cbd5e1" font-size="11">Peso pacchetto: &lt; 95 KB</text>
    <text x="22" y="226" fill="#94a3b8" font-size="10">Zero dipendenze esterne</text>
  </g>
</svg>

